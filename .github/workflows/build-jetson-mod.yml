name: Build Jetson mod

on:
  push:
    paths:
      - 'jetson-mod/**'
      - '.github/workflows/build-jetson-mod.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jetson-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x gradlew && ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: jetsonmod-1.21.1
          path: jetson-mod/build/libs/*.jar
