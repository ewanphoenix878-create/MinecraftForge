name: Build Uncrafting Table mod

on:
  push:
    paths:
      - 'uncrafting-table-mod/**'
      - '.github/workflows/uncrafting-table-mod.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uncrafting-table-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: uncraftingtable-1.20.1
          path: uncrafting-table-mod/build/libs/*.jar
      - name: Publish jar as a release download
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete uncraftingtable-latest --yes --cleanup-tag || true
          gh release create uncraftingtable-latest build/libs/uncraftingtable-1.0.0.jar \
            --target "$GITHUB_SHA" \
            --title "Uncrafting Table (Forge 1.20.1)" \
            --notes "Latest build of the Uncrafting Table mod for Forge 1.20.1. Download uncraftingtable-1.0.0.jar below and put it in your .minecraft/mods folder."
