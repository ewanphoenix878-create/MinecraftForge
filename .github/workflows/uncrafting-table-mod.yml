name: Build Uncrafting Table mod

on:
  push:
    paths:
      - 'uncrafting-table-mod/**'
      - 'uncrafting-table-mod-neoforge-1.21.1/**'
      - '.github/workflows/uncrafting-table-mod.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Forge 1.20.1
            dir: uncrafting-table-mod
            java: 17
            jar: uncraftingtable-1.0.0.jar
            artifact: uncraftingtable-1.20.1
            tag: uncraftingtable-latest
          - name: NeoForge 1.21.1
            dir: uncrafting-table-mod-neoforge-1.21.1
            java: 21
            jar: uncraftingtable-neoforge-1.21.1-1.0.0.jar
            artifact: uncraftingtable-neoforge-1.21.1
            tag: uncraftingtable-neoforge-1.21.1-latest
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dir }}/build/libs/${{ matrix.jar }}
      - name: Publish jar as a release download
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete ${{ matrix.tag }} --yes --cleanup-tag || true
          gh release create ${{ matrix.tag }} build/libs/${{ matrix.jar }} \
            --target "$GITHUB_SHA" \
            --title "Uncrafting Table (${{ matrix.name }})" \
            --notes "Latest build of the Uncrafting Table mod for ${{ matrix.name }}. Download ${{ matrix.jar }} below and put it in your modpack's mods folder."
